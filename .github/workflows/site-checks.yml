name: Site checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/build-product-pages.py --check
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/verify-site.py
      - run: node --check navigation.js && node --check pages.js && node --check app.js && node --check product.js && node --check assets/icons.js
      - run: node --test tests/demo-*.test.mjs
      - run: git diff --check
  browser-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save --no-package-lock playwright@1.62.1 axe-core@4.13.0
      - run: npx playwright install --with-deps chromium
      - name: Start static server and verify demo
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/flight-ai-server.log 2>&1 &
          for attempt in {1..20}; do curl -fsS http://127.0.0.1:8080/app.html > /dev/null && break; sleep 1; done
          node tests/browser/core.cjs
          node tests/browser/edges.cjs
          node tests/browser/continuity.cjs
