name: Site checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/build-product-pages.py --check
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/verify-site.py
      - run: node --check pages.js && node --check app.js && node --check product.js && node --check assets/icons.js
      - run: git diff --check
